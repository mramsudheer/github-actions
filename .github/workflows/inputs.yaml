name: Input Demo
run-name: "Manual Run by @${{ github.actor }} - Log: ${{ inputs.logLevel }}"
on: 
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log Level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test Senario Tags'
        required: false
        type: boolean
jobs:
  Trigger:
    runs-on: ubuntu-latest
    steps:
    - name: Print Inputs
      run: |
        echo "Log level: ${{ inputs.logLevel }}"
        echo "Tags: ${{ inputs.tags }}"