# GITHUB_ENV is strictly isolated to the same job [1]. 
# As soon as that specific job finishes, the file is destroyed, 
# and any variables you saved inside it are lost forever.

 # $GITHUB_ENV is not useful for cross jobs.
# $GITHUB_ENV is only for within the same job, but can be used in diff. steps in the same job
name: GitHub Environment
on:
  workflow_dispatch:
jobs:
  GitHub_Env:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Env
        run: |
          echo "course=DevOps" >> $GITHUB_ENV
          echo "duration=5months" >> $GITHUB_ENV

      - name: Print GitHub Env Values
        run: |
          echo "Course: $course"
          echo "Duration: $duration"
